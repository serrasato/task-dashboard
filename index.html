<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Task Dashboard v15</title>
<style>
  :root{
    --bg:#f6f7f8;
    --panel:#ffffff;
    --panel-soft:#fafafa;
    --line:#e4e7eb;
    --text:#202124;
    --muted:#6f7680;
    --accent:#2f6fbe;
    --accent-soft:#eaf2fb;
    --warn:#d97706;
    --radius:14px;
  }

  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:Arial,"Yu Gothic","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
  }
  button,input,select,textarea{font:inherit}

  .app{min-height:100vh;display:block}

  .main{
    width:100%;
    min-width:0;
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }

  .dashboard-view:not([hidden]){
    display:flex;
    flex:1;
    flex-direction:column;
    min-width:0;
  }

  .memo-page{
    width:100%;
    max-width:1100px;
    margin:0 auto;
    padding:20px 24px 40px;
  }

  .memo-editor,.memo-note{
    padding:14px;
    border:1px solid var(--line);
    border-radius:12px;
    background:var(--panel);
  }
  .memo-editor{min-width:0;margin:0;scroll-margin-top:76px}
  .memo-editor legend{padding:0 5px;color:#17395f;font-weight:bold}
  .memo-editor label{display:block;margin-bottom:6px;font-size:13px;font-weight:bold}
  .memo-editor textarea{
    width:100%;
    min-width:0;
    padding:8px 10px;
    border:1px solid #cfd8e3;
    border-radius:8px;
    background:#fff;
    color:inherit;
    resize:vertical;
  }
  #memoBody{min-height:105px}

  .memo-actions,.memo-note-header{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:8px;
  }
  .memo-editor .memo-actions{margin-top:10px}
  .memo-note-header{justify-content:space-between}
  .memo-note-header time{color:var(--muted);font-size:13px}
  .memo-hint,.memo-status,.memo-empty{color:var(--muted);font-size:13px}
  .memo-status:empty{display:none}
  .memo-storage-notice{margin:0 0 12px}

  .memo-list,.memo-images{
    display:grid;
    gap:10px;
  }
  .memo-list{margin-top:14px}
  .memo-images{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
  .memo-images:not(:empty){margin-top:10px}
  .memo-attachment{
    min-width:0;
    margin:0;
    padding:8px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--panel-soft);
  }
  .memo-attachment textarea{min-height:58px}
  .memo-image-open{
    display:block;
    width:100%;
    margin:0 0 8px;
    padding:0;
    border:0;
    background:none;
    cursor:zoom-in;
  }
  .memo-image-open img{
    display:block;
    max-width:100%;
    max-height:220px;
    margin:auto;
    object-fit:contain;
  }
  .memo-text,.memo-caption{
    margin:10px 0 0;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    line-height:1.55;
  }

  .memo-viewer{
    width:max-content;
    max-width:calc(100% - 24px);
    max-height:calc(100% - 24px);
    padding:12px;
    border:1px solid var(--line);
    border-radius:12px;
  }
  .memo-viewer img{
    display:block;
    max-width:100%;
    max-height:75vh;
    margin:10px auto 0;
    object-fit:contain;
  }

  .top-header{
    min-height:64px;
    background:#fff;
    border-bottom:1px solid var(--line);
    padding:0 24px;
    display:flex;
    align-items:center;
    gap:10px;
    position:sticky;
    top:0;
    z-index:30;
  }

  .dashboard-brand{
    border:0;
    background:transparent;
    padding:10px 18px 10px 0;
    color:#132f50;
    font-size:22px;
    font-weight:800;
    cursor:pointer;
    white-space:nowrap;
    border-right:1px solid var(--line);
    margin-right:2px;
  }
  .dashboard-brand.active{color:#0f4f8d}

  .top-nav{
    display:flex;
    align-items:center;
    gap:5px;
    min-width:0;
    overflow-x:auto;
  }
  .top-nav button{
    border:0;
    background:transparent;
    color:#4b5560;
    min-height:40px;
    padding:9px 16px;
    border-radius:9px;
    cursor:pointer;
    font-size:15px;
    font-weight:700;
    white-space:nowrap;
  }
  .top-nav[hidden]{display:none}
  .top-nav button:hover{background:#f1f4f7}
  .top-nav button.active{color:#17395f;background:#dfe7f2}

  .category-settings{margin-left:auto;flex:0 0 auto}
  .sync-panel{margin:12px 24px 0;padding:12px;border:1px solid var(--line);border-radius:8px;background:#fff}
  .sync-fields{display:flex;align-items:end;flex-wrap:wrap;gap:8px}
  .sync-fields .field{flex:0 1 260px}
  #syncStatus{margin:8px 0 0;font-size:13px;overflow-wrap:anywhere}
  .category-manager{
    width:min(100% - 24px,480px);
    max-height:calc(100% - 24px);
    padding:16px;
    border:1px solid var(--line);
    border-radius:12px;
    color:var(--text);
    overflow:auto;
  }
  .category-manager-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:14px;
  }
  .category-manager-header h2{margin:0;color:#17395f;font-size:18px}
  .category-manager-rows{
    display:grid;
    gap:8px;
    padding-top:14px;
    margin-top:14px;
    border-top:1px solid var(--line);
  }
  .category-manager-row{
    display:grid;
    grid-template-columns:minmax(0,1fr) auto;
    align-items:center;
    gap:8px;
  }
  .category-manager-status{margin:10px 0 0;color:#46576a;font-size:13px}
  .category-manager-status:empty{display:none}
  .task-lane-heading,.current-filter,.timeline-title{overflow-wrap:anywhere}

  .timeline-area{
    padding:14px 24px 10px;
    background:#fff;
  }

  .timeline-card{
    min-width:0;
    padding:12px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:var(--panel-soft);
  }

  .timeline-head,.timeline-actions{
    display:flex;
    align-items:center;
    gap:8px;
  }

  .timeline-head{
    flex-wrap:wrap;
    justify-content:space-between;
  }

  .timeline-title{
    margin:0;
    color:#17395f;
    font-size:16px;
  }

  .timeline-form{
    margin:10px 0;
    padding:10px 0;
    border-block:1px solid var(--line);
  }

  .timeline-fields{
    display:grid;
    grid-template-columns:minmax(0,1fr) 145px 155px 120px;
    align-items:end;
    gap:8px;
  }

  .timeline-form-footer{
    display:grid;
    grid-template-columns:minmax(0,1fr) auto;
    align-items:end;
    gap:8px;
    margin-top:8px;
  }

  .timeline-status{
    color:#46576a;
    font-size:12px;
  }
  .task-feedback{
    display:flex;
    gap:8px;
    align-items:center;
    flex-wrap:wrap;
    margin-top:8px;
  }
  .task-feedback:has(.timeline-status:empty){display:none}
  .storage-notice{
    margin:8px 24px 0;
    padding:8px 10px;
    border-radius:8px;
    background:#fff3d9;
    color:#654400;
    font-size:13px;
  }
  .delete-dialog{
    width:min(340px,calc(100% - 24px));
    border:1px solid var(--line);
    border-radius:var(--radius);
    color:var(--text);
  }
  .delete-dialog-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
  }
  .content{scroll-margin-top:72px}

  .timeline-nav{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:10px;
    padding-top:8px;
    border-top:1px solid var(--line);
  }
  .timeline-nav[hidden]{display:none}
  .timeline-nav .btn{padding:4px 8px;font-size:12px}
  .timeline-nav .btn:disabled{color:var(--muted);cursor:default}

  .timeline-strip{
    --day-width:156px;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(min(100%,var(--day-width)),1fr));
    row-gap:12px;
  }

  .timeline-empty{
    margin:12px 0 2px;
    color:var(--muted);
    font-size:13px;
  }

  .timeline-day{
    min-width:0;
    position:relative;
    padding:9px 8px 4px;
    scroll-margin-top:72px;
  }

  .timeline-axis{
    position:relative;
    height:2px;
    margin:9px -8px 12px;
    background:#a9bcd4;
  }

  .timeline-axis::before{
    content:"";
    position:absolute;
    top:50%;
    left:16px;
    width:8px;
    height:8px;
    transform:translate(-50%,-50%);
    border:2px solid #fafafa;
    border-radius:50%;
    background:#3973ac;
    box-shadow:0 0 0 1px #3973ac;
  }
  .past .timeline-axis::before{background:#68798d;box-shadow:0 0 0 1px #68798d}
  .today .timeline-axis::before{
    width:12px;
    height:12px;
    background:#135da6;
    box-shadow:0 0 0 2px #135da6;
  }

  .timeline-day-heading{
    display:flex;
    align-items:center;
    gap:4px 6px;
    min-height:32px;
    margin:0;
    color:#17395f;
    font-size:12px;
    line-height:1.2;
    font-variant-numeric:tabular-nums;
    overflow-wrap:anywhere;
  }

  .timeline-countdown{
    padding:2px 6px;
    border-radius:5px;
    background:var(--accent-soft);
    color:#17395f;
  }
  .past .timeline-countdown{background:#eef0f2;color:#4d5d6d}
  .today .timeline-countdown{background:#135da6;color:#fff}
  .soon .timeline-countdown{background:#fff1cf;color:#774600}

  .timeline-day-events{
    display:grid;
    align-content:start;
    gap:5px;
  }

  .timeline-entry{
    min-width:0;
    padding:7px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--panel);
    scroll-margin-top:72px;
  }

  .timeline-time{
    color:var(--muted);
    font-size:11px;
    font-variant-numeric:tabular-nums;
  }

  .timeline-entry-meta{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:4px;
  }

  .timeline-genre{
    display:inline-block;
    padding:2px 6px;
    border-radius:5px;
    color:#17395f;
    background:var(--accent-soft);
    font-size:11px;
    font-weight:700;
  }

  .timeline-entry-title{
    display:block;
    margin-top:4px;
    font-size:13px;
    overflow-wrap:anywhere;
  }

  .timeline-memo{
    margin:4px 0 0;
    color:#4b5560;
    font-size:12px;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
  }

  .timeline-entry .timeline-actions{flex-wrap:wrap;margin-top:6px}
  .timeline-actions .btn{padding:4px 7px;font-size:12px}
  .create-area{scroll-margin-top:72px}
  .timeline-area{scroll-margin-top:72px}

  .current-filter{
    color:#17395f;
    font-size:18px;
    font-weight:800;
    margin:0 0 12px;
  }

  /* タスク追加：横幅いっぱい・3行以内 */
  .create-area{
    background:#fff;
    border-bottom:1px solid var(--line);
    padding:7px 24px 8px;
  }

  .create-card{
    width:100%;
    background:var(--panel-soft);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:8px 12px;
  }

  .create-head{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:0;
    min-height:0;
  }

  .create-head:has(.edit-badge[hidden]){
    display:none;
  }

  .create-head:not(:has(.edit-badge[hidden])){
    margin-bottom:6px;
  }

  .create-title{
    margin:0;
    color:#17395f;
    font-size:16px;
    font-weight:800;
  }

  .edit-badge{
    display:inline-flex;
    align-items:center;
    border-radius:999px;
    background:#fff3d9;
    color:#8d5c00;
    padding:4px 9px;
    font-size:12px;
    font-weight:700;
  }

  .create-row-1{
    display:grid;
    grid-template-columns:minmax(300px,2fr) 150px 155px 105px;
    gap:8px;
    align-items:end;
  }

  .create-row-2{
    display:grid;
    grid-template-columns:minmax(360px,1fr) auto;
    gap:10px;
    align-items:end;
    margin-top:6px;
  }

  .field{min-width:0}
  .label{
    display:block;
    margin:0 0 4px 2px;
    color:var(--muted);
    font-size:11px;
    font-weight:700;
  }

  .control{
    display:block;
    width:100%;
    height:36px;
    border:1px solid #d4d8dd;
    border-radius:8px;
    background:#fff;
    color:var(--text);
    padding:0 10px;
    outline:none;
  }

  textarea.control{
    height:40px;
    min-height:40px;
    max-height:72px;
    padding:8px 10px;
    resize:vertical;
    line-height:1.35;
  }

  .control:focus{
    border-color:#7da3d1;
    box-shadow:0 0 0 3px rgba(47,111,190,.12);
  }

  .save-buttons{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    justify-content:flex-end;
    align-items:center;
    align-self:end;
  }

  .btn{
    border:1px solid #d7dbe0;
    border-radius:8px;
    background:#fff;
    color:#333;
    padding:7px 10px;
    cursor:pointer;
    white-space:nowrap;
    font-size:13px;
  }

  .btn:hover{background:#f3f5f7}
  .btn.primary{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
    font-weight:700;
  }
  .btn.daily{color:#7b6500;border-color:#e5d79b;background:#fffdf3}
  .btn.weekly{color:#285c92;border-color:#b8d0e7;background:#f6fbff}
  .btn.monthly{color:#7350a0;border-color:#d2c2e4;background:#fbf8ff}
  .btn.cancel{color:#666}

  /* 反復タスク3ブロック */
  .recurring-area{
    background:#fff;
    border-bottom:1px solid var(--line);
    padding:10px 24px 12px;
  }

  .recurring-grid{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:14px;
  }

  .recurring-card{
    min-width:0;
    background:var(--panel-soft);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:10px;
    min-height:155px;
    max-height:250px;
    overflow:auto;
  }

  .recurring-head{
    position:sticky;
    top:-10px;
    z-index:3;
    margin:-10px -10px 8px;
    padding:10px 10px 6px;
    background:var(--panel-soft);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }

  .recurring-title{
    margin:0;
    font-size:15px;
    color:#17395f;
    font-weight:800;
  }

  .reset-btn{
    border:1px solid #d6dce3;
    border-radius:8px;
    background:#fff;
    color:#4d5d6d;
    padding:6px 8px;
    cursor:pointer;
    font-size:11px;
    white-space:nowrap;
  }

  /* 各ブロック内は3列。4件目は2行目へ */
  .mini-grid{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:7px;
    align-content:start;
  }

  .toolbar{
    background:#fff;
    border-bottom:1px solid var(--line);
    padding:10px 24px;
    display:flex;
    align-items:center;
    gap:18px;
    flex-wrap:wrap;
  }
  .toolbar label{color:#555;font-size:14px}
  .toolbar select{
    margin-left:6px;
    padding:7px 30px 7px 10px;
    border:1px solid #d8dce1;
    border-radius:9px;
    background:#fff;
  }

  .content{
    flex:1;
    padding:18px 24px 40px;
  }

  .list-title{
    color:#17395f;
    margin:0 0 14px;
  }

  .task-lanes{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:12px;
  }

  .task-lane{
    min-width:0;
    padding:10px;
    border:1px solid var(--line);
    border-top:3px solid var(--accent);
    border-radius:12px;
    background:#eef2f6;
  }
  .task-lane[data-genre="MTG"]{border-top-color:#7456a5}
  .task-lane[data-genre="スキルアップ"]{border-top-color:#387b63}
  .task-lane[data-genre="私用"]{border-top-color:#a85b30}

  .task-lane-heading{
    margin:0 0 10px;
    color:#17395f;
    font-size:15px;
  }
  .task-lane .task-row:last-child{margin-bottom:0}
  .task-lane .task-row{gap:6px}
  .task-lane .task-check{margin-top:11px}
  .task-lane .task-summary{padding:9px;gap:6px}
  .task-lane .task-name{font-size:14px;white-space:normal}
  .task-lane .task-genre{display:none}
  .task-lane .task-name,.task-lane .task-meta,.task-lane .memo{overflow-wrap:anywhere}

  .task-list-empty{
    margin:0;
    padding:14px 4px;
    color:var(--muted);
    text-align:center;
    font-size:13px;
  }
  .other-tasks{margin-top:18px}

  .task-row{
    display:flex;
    align-items:flex-start;
    gap:9px;
    margin-bottom:10px;
  }

  .task-check{
    width:20px;
    height:20px;
    margin:15px 0 0 2px;
    flex:0 0 auto;
    cursor:pointer;
  }

  details.task{
    flex:1;
    min-width:0;
    background:#fff;
    border:1px solid var(--line);
    border-radius:11px;
    overflow:hidden;
  }

  summary.task-summary{
    list-style:none;
    cursor:pointer;
    padding:13px;
    display:flex;
    align-items:center;
    gap:9px;
    min-width:0;
  }
  summary.task-summary::-webkit-details-marker{display:none}

  .arrow{width:16px;color:#777;flex:0 0 auto}
  details[open] .arrow{transform:rotate(90deg)}

  .task-main{min-width:0;flex:1}
  .task-name{
    display:block;
    font-size:16px;
    font-weight:700;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .task-name.done{
    color:#999;
    text-decoration:line-through;
  }

  .task-meta{
    margin-top:5px;
    font-size:12px;
    color:#68707a;
    line-height:1.45;
  }

  .task-body{
    border-top:1px solid var(--line);
    padding:11px 13px;
  }

  .memo{
    white-space:pre-wrap;
    line-height:1.6;
    font-size:14px;
    margin-bottom:10px;
  }
  .memo.empty{color:#aaa}

  .task-buttons{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
  }

  /* 反復タスク用コンパクトカード */
  .mini-grid .task-row{
    gap:5px;
    margin:0;
    min-width:0;
  }

  .mini-grid .task-check{
    width:17px;
    height:17px;
    margin-top:11px;
  }

  .mini-grid details.task{
    border-radius:8px;
  }

  .mini-grid summary.task-summary{
    padding:9px 7px;
    gap:4px;
  }

  .mini-grid .arrow{width:12px;font-size:10px}
  .mini-grid .task-name{font-size:12px}
  .mini-grid .task-meta{
    font-size:9px;
    margin-top:3px;
    line-height:1.35;
  }
  .mini-grid .task-body{
    padding:8px;
    font-size:11px;
  }
  .mini-grid .memo{
    font-size:11px;
    margin-bottom:7px;
  }
  .mini-grid .btn{
    padding:5px 7px;
    font-size:10px;
  }

  .empty{
    grid-column:1/-1;
    color:#999;
    padding:18px 6px;
    font-size:12px;
  }

  @media (max-width:1200px){
    .create-row-1{
      grid-template-columns:minmax(240px,1fr) 150px 150px 105px;
    }
    .create-row-2{
      grid-template-columns:1fr;
    }
    .save-buttons{
      justify-content:flex-start;
    }
    .mini-grid{
      grid-template-columns:repeat(2,minmax(0,1fr));
    }
  }

  @media (max-width:900px){
    .recurring-grid{grid-template-columns:1fr}
    .recurring-card{max-height:280px}
    .mini-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
    .task-lanes{grid-template-columns:repeat(2,minmax(0,1fr))}
  }

  @media (max-width:540px){
    .task-lanes{grid-template-columns:minmax(0,1fr)}
  }

  @media (max-width:700px){
    .top-header{
      padding:7px 12px;
      gap:6px;
      align-items:flex-start;
      flex-direction:column;
    }

<body>
<div class="app">
  <main class="main">
    <header class="top-header">

    <div class="dashboard-view" id="dashboardView">

            <div class="field timeline-genre-field">

            <div class="field">

            <div class="field">
              <label class="label" for="timelineTime">時刻（任意）</label>

          </div>

        <div class="timeline-nav" id="timelineNav" aria-label="表示する日付" hidden>

    <section class="create-area" id="createArea">
      <div class="create-card">

        <div class="create-row-1">

            <button class="btn daily" data-save-type="daily">☀️ デイリーに追加</button>
            <button class="btn weekly" data-save-type="weekly">📅 ウィークリーに追加</button>

    <section class="toolbar">

    <section class="content" id="taskContent" aria-labelledby="listTitle" tabindex="-1">

    <section class="memo-page" id="memoPage" aria-labelledby="memoHeading" hidden>

<script>
(() => {
  // SupabaseのConnect画面から取得した2つの値を、引用符の内側に貼り付けます。
  const SUPABASE_PROJECT_URL = "https://zipmuzzbxbbxaahuplxy.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_nGGMNnJyBxp7H-_sOv5jqw_cgosIHLT";
  const syncConfigured = SUPABASE_PROJECT_URL !== "ここにProject URL" ||
    SUPABASE_PUBLISHABLE_KEY !== "sb_publishable_nGGMNnJyBxp7H-_sOv5jqw_cgosIHLT";
  const STORAGE_KEY = "simple_tasks_v2";
  const TIMELINE_STORAGE_KEY = "task_dashboard_timeline_v1";
  const CATEGORY_STORAGE_KEY = "task_dashboard_categories_v1";

  let storage;
  let temporaryStorage = false;
  try {
    storage = window.localStorage;
    storage.getItem(STORAGE_KEY);
  } catch {
    temporaryStorage = true;
    const temporaryData = new Map();
    storage = {
      getItem: key => temporaryData.get(key) ?? null,
      setItem: (key, value) => temporaryData.set(key, value)
    };
  }

  const readTasks = (source = storage) => {
    try {
      const saved = JSON.parse(source.getItem(STORAGE_KEY) ??
        source.getItem("simple_tasks_v1") ?? "[]");
      if (!Array.isArray(saved) || !saved.every(task =>
        task && typeof task === "object" && !Array.isArray(task)
      )) return null;

      // 旧データを新仕様に自動移行
      return saved.map(({daily, ...task}) => ({
        ...task,
        g: task.g || "未分類",
        m: task.m || "",
        repeat: task.repeat || (daily ? "daily" : "none")
      }));
    } catch {
      return null;
    }
  };
  const loadedTasks = readTasks();
  let tasks = loadedTasks ?? [];

  let selectedGenre = "all";
  let activeView = "all";
  let sortMode = "priority";
  let showDone = false;
  let editingId = null;
  let editingTimelineId = null;

  const genreIcons = {
    仕事: "💼",
    MTG: "🃏",
    スキルアップ: "📚",
    私用: "🏠",
    memos: "📝"
  };
  // 旧版のタスク・予定が持つ大項目の文字列を既存項目のIDとして保持する。
  const defaultCategories = [
    {id:"仕事", name:"仕事"},
    {id:"MTG", name:"MTG"},
    {id:"スキルアップ", name:"スキルアップ"},
    {id:"私用", name:"私用"},
    {id:"memos", name:"メモ"}
  ];

  const readCategories = (source = storage) => {
    try {
      const raw = source.getItem(CATEGORY_STORAGE_KEY);
      if (raw === null) return defaultCategories;
      const stored = JSON.parse(raw);
      if (!Array.isArray(stored) || !stored.every(item =>
        item && typeof item.id === "string" && typeof item.name === "string" &&
        item.name.trim() && (item.id.startsWith("category-") ||
          defaultCategories.some(original => original.id === item.id)))) return null;
      const ids = new Set(stored.map(item => item.id));
      if (ids.size !== stored.length || defaultCategories.some(item => !ids.has(item.id))) return null;
      return stored;
    } catch {
      return null;
    }
  };

  let categories = readCategories() ?? defaultCategories;
  const taskCategories = () => categories.filter(item => item.id !== "memos");
  const categoryName = id => categories.find(item => item.id === id)?.name ?? id;
  const categoryIcon = id => genreIcons[id] ?? "📁";
  const isTaskCategory = id => id !== "memos" && categories.some(item => item.id === id);
  const defaultGenre = () => selectedGenre === "all" ? taskCategories()[0].id : selectedGenre;
  const matchesGenre = genre => selectedGenre === "all" || genre === selectedGenre;

  const repeatLabels = {
    none: "通常",
    daily: "デイリー",
    weekly: "ウィークリー",
    monthly: "マンスリー"
  };

  const priorityRank = { 高: 0, 中: 1, 低: 2 };
  const el = id => document.getElementById(id);

  const localDate = date => [
    String(date.getFullYear()).padStart(4, "0"),
    String(date.getMonth() + 1).padStart(2, "0"),
    String(date.getDate()).padStart(2, "0")
  ].join("-");
  const today = () => localDate(new Date());

  const weekKey = () => {
    const d = new Date();
    d.setHours(0,0,0,0);
    const day = d.getDay();
    const diff = day === 0 ? -6 : 1 - day;
    d.setDate(d.getDate() + diff);
    return "W:" + localDate(d);
  };

  const monthKey = () => {
    const d = new Date();
    return "M:" + d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
  };

  const periodKey = repeat => {
    if (repeat === "daily") return today(); // 旧デイリーのlastDone互換
    if (repeat === "weekly") return weekKey();
    if (repeat === "monthly") return monthKey();
    return "";
  };

  const taskStatus = (message, listView = "") => {
    el("taskStatus").textContent = message;
    const button = el("openTaskList");
    button.hidden = !listView;
    button.dataset.viewTarget = listView;
  };

  const saveTasks = async (current, updated) => {
    try {
      await saveCollection("task", STORAGE_KEY, current, updated);
      tasks = updated;
      return true;
    } catch (error) {
      if (syncConfigured) {
        tasks = readTasks() ?? [];
        render();
      }
      taskStatus(saveErrorMessage(error, "タスク"));
      el("taskStatus").scrollIntoView({block:"nearest"});
      return false;
    }
  };

  const tasksForChange = () => {
    const current = readTasks();
    if (!current) {
      taskStatus("保存済みのタスクを読み込めませんでした。既存データは上書きしていません。");
      el("taskStatus").scrollIntoView({block:"nearest"});
    }
    return current;
  };

  const confirmDelete = message => {
    const dialog = el("deleteDialog");
    el("deleteMessage").textContent = message;
    dialog.returnValue = "";
    dialog.showModal();
    return new Promise(resolve => {
      dialog.addEventListener("close", () => resolve(dialog.returnValue === "delete"), {once:true});
    });
  };

  const escapeHtml = value =>
    String(value).replace(/[&<>"']/g, char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[char]);

  const readTimeline = (source = storage) => {
    try {
      const entries = JSON.parse(source.getItem(TIMELINE_STORAGE_KEY) ?? "[]");
      const valid = Array.isArray(entries) && entries.every(entry =>
        entry && ["id", "title", "genre", "date", "time", "memo"].every(
          field => typeof entry[field] === "string"
        ) && Number.isFinite(entry.createdAt)
      );
      return valid ? entries : null;
    } catch {
      return null;
    }
  };

  const saveTimeline = async (current, entries) => {
    try {
      await saveCollection("timeline", TIMELINE_STORAGE_KEY, current, entries);
      return true;
    } catch (error) {
      timelineStatus(saveErrorMessage(error, "タイムライン"));
      el("timelineStatus").scrollIntoView({block:"nearest"});
      return false;
    }
  };

  const timelineStatus = (message, genre = "", date = "") => {
    el("timelineStatus").textContent = message;
    const button = el("openTimelineGenre");
    button.hidden = !genre;
    button.dataset.genre = genre;
    button.dataset.date = date;
    button.textContent = genre ? categoryName(genre) + "のタイムラインを開く" : "";
  };

  const setTimelineFormVisible = visible => {
    el("timelineForm").hidden = !visible;
    el("timelineOpen").hidden = visible;
    el("timelineOpen").setAttribute("aria-expanded", String(visible));
  };

  const openTimelineForm = (entry = null) => {
    editingTimelineId = entry?.id ?? null;
    el("timelineTitle").value = entry?.title ?? "";
    el("timelineGenre").value = isTaskCategory(entry?.genre) ? entry.genre : defaultGenre();
    el("timelineDate").value = entry?.date ?? today();
    el("timelineTime").value = entry?.time ?? "";
    el("timelineMemo").value = entry?.memo ?? "";
    el("timelineSave").textContent = entry ? "更新" : "登録";
    timelineStatus("");
    setTimelineFormVisible(true);
    el("timelineArea").scrollIntoView({block:"start"});
    el("timelineTitle").focus({preventScroll:true});
  };

  const closeTimelineForm = () => {
    editingTimelineId = null;
    setTimelineFormVisible(false);
  };

  const calendarDay = date => {
    const [year, month, day] = date.split("-").map(Number);
    const utcDate = new Date(0);
    utcDate.setUTCFullYear(year, month - 1, day);
    return utcDate.getTime() / 86400000;
  };

  const countdown = days => {
    if (days === 0) return "今日";
    return days > 0 ? `あと${days}日` : `${-days}日前`;
  };

  const timelineDayId = date => "timeline-day-" + date;

  const goToTimelineDate = date => {
    const day = document.getElementById(timelineDayId(date));
    if (!day) return;
    day.scrollIntoView({block:"start"});
    day.focus({preventScroll:true});
  };

  const timelineEntryCard = entry => {
    const id = escapeHtml(entry.id);
    return `<article class="timeline-entry">
      <div class="timeline-entry-meta">
        <span class="timeline-genre">${escapeHtml(categoryName(entry.genre))}</span>
        ${entry.time ? `<time class="timeline-time">${escapeHtml(entry.time)}</time>` : ""}
      </div>
      <strong class="timeline-entry-title">${escapeHtml(entry.title)}</strong>
      ${entry.memo ? `<p class="timeline-memo">${escapeHtml(entry.memo)}</p>` : ""}
      <div class="timeline-actions">
        <button class="btn" type="button" data-timeline-edit="${id}">編集</button>
        <button class="btn" type="button" data-timeline-delete="${id}">削除</button>
      </div>
    </article>`;
  };

  let timelineRenderedOn = "";

  const renderTimeline = () => {
    el("timelineHeading").textContent = selectedGenre === "all"
      ? "タイムライン"
      : categoryName(selectedGenre) + "のタイムライン";

    const currentDate = today();
    timelineRenderedOn = currentDate;
    const list = el("timelineList");
    const entries = readTimeline();
    if (!entries) {
      el("timelineNav").hidden = true;
      list.innerHTML = '<p class="timeline-empty">タイムラインを読み込めませんでした。</p>';
      return;
    }

    const visible = entries
      .filter(entry => matchesGenre(entry.genre))
      .sort((a, b) => a.time.localeCompare(b.time) || a.createdAt - b.createdAt);
    const groups = new Map([[currentDate, []]]);
    for (const entry of visible) {
      if (!groups.has(entry.date)) groups.set(entry.date, []);
      groups.get(entry.date).push(entry);
    }

    const currentDay = calendarDay(currentDate);
    const days = Array.from(groups, ([date, dayEntries]) => ({
      date,
      entries: dayEntries,
      offset: calendarDay(date) - currentDay
    })).sort((a, b) => a.offset - b.offset);

    const todayIndex = days.findIndex(day => day.date === currentDate);
    const previous = days[todayIndex - 1];
    const next = days[todayIndex + 1];
    el("timelineNav").hidden = !visible.length;
    el("timelinePrevious").disabled = !previous;
    el("timelinePrevious").dataset.date = previous?.date ?? "";
    el("timelineToday").dataset.date = currentDate;
    el("timelineNext").disabled = !next;
    el("timelineNext").dataset.date = next?.date ?? "";
    el("timelineNext").textContent = next ? `次の予定 · ${countdown(next.offset)} →` : "次の予定 →";

    const currentYear = Number(currentDate.split("-")[0]);
    const strip = days.map(({date, entries: dayEntries, offset}) => {
      const [year, month, day] = date.split("-").map(Number);
      const dateLabel = year === currentYear
        ? `${month}/${day}` : `${year}/${month}/${day}`;
      const state = offset === 0 ? "today" : offset < 0 ? "past" : offset <= 3 ? "soon" : "";
      const id = escapeHtml(timelineDayId(date));
      return `<section class="timeline-day ${state}" id="${id}" aria-labelledby="${id}-heading" tabindex="-1">
        <h3 class="timeline-day-heading" id="${id}-heading">
          <time datetime="${escapeHtml(date)}">${dateLabel}</time>
          <span class="timeline-countdown">${countdown(offset)}</span>
        </h3>
        <div class="timeline-axis" aria-hidden="true"></div>
        <div class="timeline-day-events">${dayEntries.map(timelineEntryCard).join("")}</div>
      </section>`;
    }).join("");
    const empty = visible.length ? "" : '<p class="timeline-empty">登録された予定・記録はありません。</p>';
    list.innerHTML = `<div class="timeline-strip">${strip}</div>${empty}`;
  };

  const effectiveDone = task => {
    if (task.repeat && task.repeat !== "none") {
      return task.lastDone === periodKey(task.repeat);
    }
    return !!task.done;
  };

  const compareTasks = (a, b) => {
    const priorityDiff =
      (priorityRank[a.p] ?? 9) - (priorityRank[b.p] ?? 9);

    const dateDiff =
      (a.d || "9999-12-31").localeCompare(b.d || "9999-12-31");

    return sortMode === "priority"
      ? priorityDiff || dateDiff
      : dateDiff || priorityDiff;
  };

  const resetForm = () => {
    taskStatus("");
    editingId = null;
    el("name").value = "";
    el("genre").value = defaultGenre();
    el("date").value = "";
    el("priority").value = "中";
    el("memo").value = "";
    el("editBadge").hidden = true;
    el("cancel").hidden = true;

    document.querySelectorAll("[data-save-type]").forEach(button => {
      const type = button.dataset.saveType;
      button.textContent =
        type === "none" ? "通常タスクに追加" :
        type === "daily" ? "☀️ デイリーに追加" :
        type === "weekly" ? "📅 ウィークリーに追加" :
        "🗓️ マンスリーに追加";
    });
  };

  const startEdit = task => {
    taskStatus("");
    editingId = task.id;
    el("name").value = task.n || "";
    el("genre").value = isTaskCategory(task.g) ? task.g : defaultGenre();
    el("date").value = task.d || "";
    el("priority").value = task.p || "中";
    el("memo").value = task.m || "";
    el("editBadge").textContent = "編集中：" + repeatLabels[task.repeat || "none"];
    el("editBadge").hidden = false;
    el("cancel").hidden = false;

    document.querySelectorAll("[data-save-type]").forEach(button => {
      const type = button.dataset.saveType;
      button.textContent =
        type === "none" ? "通常タスクとして更新" :
        type === "daily" ? "☀️ デイリーとして更新" :
        type === "weekly" ? "📅 ウィークリーとして更新" :
        "🗓️ マンスリーとして更新";
    });

    el("createArea").scrollIntoView({block:"start"});
    el("name").focus({preventScroll:true});
    el("name").select();
  };

  const taskCard = (task, compact = false) => {
    const isDone = effectiveDone(task);
    const icon =
      task.p === "高" ? "🔴" :
      task.p === "中" ? "🟡" : "🟢";

    const overdue =
      task.repeat === "none" &&
      !isDone &&
      task.d &&
      task.d < today();

    const repeatIcon =
      task.repeat === "daily" ? "☀️" :
      task.repeat === "weekly" ? "📅" :
      task.repeat === "monthly" ? "🗓️" : "";

    const meta = compact
      ? `${icon} ${escapeHtml(task.p)} ${task.m ? "📝" : ""}`
      : `<span class="task-genre">${escapeHtml(categoryName(task.g))}　</span>${icon} ${escapeHtml(task.p)}　${task.d ? "📅 " + escapeHtml(task.d) : ""} ${task.m ? "📝" : ""} ${repeatIcon} ${overdue ? "🚨期限切れ" : ""}`;

    return `
      <div class="task-row">
        <input
          class="task-check"
          type="checkbox"
          data-complete="${escapeHtml(task.id)}"
          title="完了"
          ${isDone ? "checked" : ""}
        >

        <details class="task">
          <summary class="task-summary">
            <span class="arrow">▶</span>
            <div class="task-main">
              <span class="task-name ${isDone ? "done" : ""}">
                ${escapeHtml(task.n)}
              </span>
              <div class="task-meta">${meta}</div>
            </div>
          </summary>

          <div class="task-body">
            <div class="memo ${task.m ? "" : "empty"}">
              ${task.m ? escapeHtml(task.m) : "メモなし"}
            </div>
            <div class="task-buttons">
              <button class="btn" type="button" data-edit="${escapeHtml(task.id)}">✏️ 編集</button>
              <button class="btn" type="button" data-delete="${escapeHtml(task.id)}">🗑️ 削除</button>
            </div>
          </div>
        </details>
      </div>
    `;
  };

  const bindTaskEvents = () => {
    document.querySelectorAll("[data-complete]").forEach(input => {
      input.addEventListener("change", async () => {
        const current = tasksForChange();
        const task = current?.find(
          item => String(item.id) === input.dataset.complete
        );
        if (!task) {
          input.checked = !input.checked;
          if (current) {
            tasks = current;
            render();
          }
          return;
        }

        const checked = input.checked;
        const change = task.repeat === "none"
          ? {done: checked}
          : {lastDone: checked ? periodKey(task.repeat) : ""};
        if (!await saveTasks(current, current.map(item => item === task ? {...task, ...change} : item))) {
          input.checked = effectiveDone(task);
          return;
        }
        render();
      });
    });

    document.querySelectorAll("[data-edit]").forEach(button => {
      button.addEventListener("click", event => {
        event.preventDefault();
        const task = tasks.find(
          item => String(item.id) === button.dataset.edit
        );
        if (task) startEdit(task);
      });
    });

    document.querySelectorAll("[data-delete]").forEach(button => {
      button.addEventListener("click", async event => {
        event.preventDefault();
        const id = button.dataset.delete;
        if (!await confirmDelete("このタスクを削除しますか？")) return;
        const current = tasksForChange();
        if (!current || !await saveTasks(current, current.filter(item => String(item.id) !== id))) return;
        if (String(editingId) === id) resetForm();
        taskStatus("タスクを削除しました。");
        render();
      });
    });
  };

  const renderNav = () => {
    document.querySelectorAll("[data-view]").forEach(button => {
      const active = button.dataset.view === activeView;
      button.classList.toggle("active", active);
      if (active) {
        button.setAttribute("aria-current", "page");
      } else {
        button.removeAttribute("aria-current");
      }
    });
  };

  const renderRecurringGroup = (type, titleId, areaId, titleText) => {
    const group = tasks
      .filter(task => task.repeat === type)
      .sort(compareTasks);

    const completed = group.filter(effectiveDone).length;

    el(titleId).textContent =
      `${titleText} (${completed}/${group.length} 完了)`;

    el(areaId).innerHTML =
      group.length
        ? group.map(task => taskCard(task, true)).join("")
        : `<div class="empty">${titleText}はまだありません</div>`;
  };

  const taskRows = list => list.length
    ? list.map(task => taskCard(task)).join("")
    : '<p class="task-list-empty">タスクなし</p>';

  const renderNormalTasks = () => {
    const visible = tasks
      .filter(task => task.repeat === "none" && matchesGenre(task.g) &&
        (showDone || !effectiveDone(task)))
      .sort(compareTasks);

    el("listTitle").textContent =
      selectedGenre === "all" ? "すべてのタスク" : categoryName(selectedGenre) + "のタスク";

    if (selectedGenre !== "all") {
      el("items").innerHTML = taskRows(visible);
      return;
    }

    const lanes = taskCategories().map(({id, name}, index) => `
      <section class="task-lane" data-genre="${escapeHtml(id)}" aria-labelledby="task-lane-heading-${index}">
        <h3 class="task-lane-heading" id="task-lane-heading-${index}">
          <span aria-hidden="true">${categoryIcon(id)}</span> ${escapeHtml(name)}
        </h3>
        ${taskRows(visible.filter(task => task.g === id))}
      </section>`).join("");
    const other = visible.filter(task => !isTaskCategory(task.g));
    const otherSection = other.length ? `<section class="other-tasks" aria-labelledby="other-tasks-heading">
      <h3 class="task-lane-heading" id="other-tasks-heading">その他のタスク</h3>
      ${taskRows(other)}
    </section>` : "";
    el("items").innerHTML = `<div class="task-lanes">${lanes}</div>${otherSection}`;
  };

  const render = () => {
    renderNav();
    renderRecurringGroup("daily", "dailyTitle", "dailyArea", "デイリータスク");
    renderRecurringGroup("weekly", "weeklyTitle", "weeklyArea", "ウィークリータスク");
    renderRecurringGroup("monthly", "monthlyTitle", "monthlyArea", "マンスリータスク");
    renderNormalTasks();
    bindTaskEvents();
  };

  const showView = (view, focusDate = "") => {
    activeView = view;
    const isMemoView = view === "memos";
    el("dashboardView").hidden = isMemoView;
    el("memoPage").hidden = !isMemoView;
    window.scrollTo(0, 0);
    if (isMemoView) {
      renderNav();
      el("memoBody").focus({preventScroll:true});
      refreshMemos();
      return;
    }
    if (selectedGenre !== view) {
      selectedGenre = view;
      closeTimelineForm();
      timelineStatus("");
      taskStatus("");
      if (editingId === null) el("genre").value = defaultGenre();
    }
    renderTimeline();
    render();
    if (focusDate) goToTimelineDate(focusDate);
  };

  const saveWithType = async repeatType => {
    const name = el("name").value.trim();
    if (!name) {
      taskStatus("タスク名を入力してください。");
      el("name").focus();
      return;
    }

    const current = tasksForChange();
    if (!current) return;
    const previous = editingId === null ? null
      : current.find(item => String(item.id) === String(editingId));
    if (editingId !== null && !previous) {
      taskStatus("このタスクは別のタブで削除されています。");
      return;
    }

    const task = {
      ...previous,
      id: previous?.id ?? (Date.now() + "-" + Math.random().toString(36).slice(2)),
      n: name,
      g: el("genre").value,
      d: el("date").value,
      p: el("priority").value,
      m: el("memo").value.trim(),
      repeat: repeatType
    };

    // 通常↔反復、または反復種別変更時は完了状態をリセット
    if (previous?.repeat !== repeatType) {
      task.done = false;
      task.lastDone = "";
    }

    const updated = previous
      ? current.map(item => item === previous ? task : item)
      : [...current, task];
    if (!await saveTasks(current, updated)) return;
    resetForm();
    render();
    const action = previous ? "更新" : "追加";
    const listView = matchesGenre(task.g) ? selectedGenre : task.g;
    taskStatus(`「${name}」を${categoryName(task.g)}の${repeatLabels[repeatType]}タスクに${action}しました。`,
      repeatType === "none" ? listView : "");
    el("name").focus({preventScroll:true});
  };

  document.querySelectorAll("[data-save-type]").forEach(button => {
    button.addEventListener("click", () => {
      return saveWithType(button.dataset.saveType);
    });
  });

  el("cancel").addEventListener("click", resetForm);
  el("openTaskList").addEventListener("click", event => {
    const view = event.currentTarget.dataset.viewTarget;
    if (view !== selectedGenre) showView(view);
    el("taskContent").scrollIntoView({block:"start"});
    el("taskContent").focus({preventScroll:true});
  });

  el("name").addEventListener("keydown", event => {
    if (event.isComposing || event.keyCode === 229) return;
    if (event.key === "Enter") {
      if (editingId !== null) {
        const current = tasks.find(
          item => String(item.id) === String(editingId)
        );
        return saveWithType(current?.repeat || "none");
      } else {
        return saveWithType("none");
      }
    }

    if (event.key === "Escape" && editingId !== null) {
      resetForm();
    }
  });

  el("sort").addEventListener("change", event => {
    sortMode = event.target.value;
    render();
  });

  el("showDone").addEventListener("change", event => {
    showDone = event.target.checked;
    render();
  });

  const resetRepeatGroup = async type => {
    const current = tasksForChange();
    if (!current) return;
    const reset = current.map(task => task.repeat === type ? {...task, lastDone:""} : task);
    if (!await saveTasks(current, reset)) return;
    render();
  };

  el("resetDaily").addEventListener("click", () => resetRepeatGroup("daily"));
  el("resetWeekly").addEventListener("click", () => resetRepeatGroup("weekly"));
  el("resetMonthly").addEventListener("click", () => resetRepeatGroup("monthly"));

  el("dashboardHome").dataset.view = "all";
  el("dashboardHome").addEventListener("click", () => showView("all"));
  el("nav").addEventListener("click", event => {
    const button = event.target.closest("[data-view]");
    if (button) showView(button.dataset.view);
  });

  const renderCategoryControls = () => {
    const nav = el("nav");
    const scrollLeft = nav.scrollLeft;
    const navigationItems = [...taskCategories(), categories.find(item => item.id === "memos")];
    nav.innerHTML = navigationItems.map(({id, name}) => `
      <button type="button" data-view="${escapeHtml(id)}">
        <span aria-hidden="true">${categoryIcon(id)}</span> ${escapeHtml(name)}
      </button>
    `).join("");
    nav.scrollLeft = scrollLeft;

    const options = taskCategories().map(({id, name}) =>
      `<option value="${escapeHtml(id)}">${escapeHtml(name)}</option>`).join("");
    for (const field of [el("genre"), el("timelineGenre")]) {
      const selected = field.value;
      field.innerHTML = options;
      field.value = isTaskCategory(selected) ? selected : defaultGenre();
    }
    el("memoHeading").textContent = categoryName("memos");
    const timelineLink = el("openTimelineGenre");
    if (timelineLink.dataset.genre) {
      timelineLink.textContent = categoryName(timelineLink.dataset.genre) + "のタイムラインを開く";
    }
  };

  const applyCategories = updated => {
    categories = updated;
    if (selectedGenre !== "all" && !isTaskCategory(selectedGenre)) {
      selectedGenre = "all";
      if (activeView !== "memos") activeView = "all";
    }
    renderCategoryControls();
    renderTimeline();
    render();
  };

  const categoryFieldId = id => "category-name-" + id;
  const categoryRowMarkup = ({id, name}) => `
    <div class="category-manager-row">
      <input class="control" id="${escapeHtml(categoryFieldId(id))}" value="${escapeHtml(name)}"
        data-category-name="${escapeHtml(id)}" aria-label="${escapeHtml(name)}の名前">
      <button class="btn" type="button" data-save-category="${escapeHtml(id)}">保存</button>
    </div>`;

  const renderCategoryRows = () => {
    const items = [...taskCategories(), categories.find(item => item.id === "memos")];
    el("categoryRows").innerHTML = items.map(categoryRowMarkup).join("");
  };

  const saveCategoryName = async (id, input) => {
    const status = el("categoryStatus");
    const name = input.value.trim();
    if (!name) {
      status.textContent = "大項目の名前を入力してください。";
      input.focus();
      return;
    }

    const current = readCategories();
    if (!current || (id && !current.some(item => item.id === id))) {
      status.textContent = "保存済みの大項目を読み込めませんでした。";
      return;
    }
    const nameKey = value => value.normalize("NFKC").toLocaleLowerCase("ja-JP");
    if (current.some(item => item.id !== id && nameKey(item.name) === nameKey(name))) {
      status.textContent = "同じ名前の大項目があります。";
      input.focus();
      return;
    }

    const item = {id:id || "category-" + Date.now() + "-" + Math.random().toString(36).slice(2), name};
    const updated = id ? current.map(existing => existing.id === id ? item : existing)
      : [...current, item];
    try {
      await saveCollection("category", CATEGORY_STORAGE_KEY, current, updated);
    } catch (error) {
      status.textContent = saveErrorMessage(error, "大項目");
      return;
    }

    applyCategories(updated);
    if (id) {
      input.value = name;
      input.setAttribute("aria-label", name + "の名前");
      status.textContent = `「${name}」に名前を変更しました。`;
    } else {
      el(categoryFieldId("memos")).parentElement.insertAdjacentHTML("beforebegin", categoryRowMarkup(item));
      input.value = "";
      input.focus();
      status.textContent = `「${name}」を追加しました。`;
    }
  };

  el("categorySettings").addEventListener("click", () => {
    renderCategoryRows();
    el("categoryStatus").textContent = "";
    el("categoryManager").showModal();
  });
  el("categoryManagerClose").addEventListener("click", () => el("categoryManager").close());
  el("categoryAdd").addEventListener("click", () => saveCategoryName("", el("categoryNewName")));
  el("categoryRows").addEventListener("click", event => {
    const button = event.target.closest("[data-save-category]");
    if (!button) return;
    const id = button.dataset.saveCategory;
    return saveCategoryName(id, el(categoryFieldId(id)));
  });
  el("categoryManager").addEventListener("keydown", event => {
    if (event.key !== "Enter" || event.isComposing || event.keyCode === 229) return;
    const input = event.target;
    if (input.id !== "categoryNewName" && input.dataset.categoryName === undefined) return;
    event.preventDefault();
    return saveCategoryName(input.dataset.categoryName ?? "", input);
  });

  el("timelineOpen").addEventListener("click", () => openTimelineForm());
  ["timelinePrevious", "timelineToday", "timelineNext"].forEach(id => {
    const button = el(id);
    button.addEventListener("click", () => goToTimelineDate(button.dataset.date));
  });
  el("openTimelineGenre").addEventListener("click", event => {
    const {genre, date} = event.currentTarget.dataset;
    showView(genre, date);
  });
  el("timelineCancel").addEventListener("click", () => {
    closeTimelineForm();
    timelineStatus("");
    el("timelineOpen").focus();
  });
  const saveTimelineEntry = async () => {
    const titleInput = el("timelineTitle");
    const title = titleInput.value.trim();
    if (!title) {
      timelineStatus("タイトルを入力してください。");
      titleInput.focus();
      return;
    }
    const dateInput = el("timelineDate");
    if (!dateInput.value || !dateInput.validity.valid) {
      timelineStatus("日付を正しく入力してください。");
      dateInput.focus();
      return;
    }
    const timeInput = el("timelineTime");
    if (!timeInput.validity.valid) {
      timelineStatus("時刻を正しく入力するか、空欄にしてください。");
      timeInput.focus();
      return;
    }

    const entries = readTimeline();
    if (!entries) {
      timelineStatus("保存済みのタイムラインを読み込めませんでした。既存データは上書きしていません。");
      return;
    }
    const previous = entries.find(entry => entry.id === editingTimelineId);
    if (editingTimelineId !== null && !previous) {
      timelineStatus("この項目は削除されています。");
      return;
    }

    const entry = {
      id: previous?.id ?? (Date.now() + "-" + Math.random().toString(36).slice(2)),
      createdAt: previous?.createdAt ?? Date.now(),
      title,
      genre: el("timelineGenre").value,
      date: dateInput.value,
      time: timeInput.value,
      memo: el("timelineMemo").value.trim()
    };
    const updated = previous
      ? entries.map(item => item.id === entry.id ? entry : item)
      : [...entries, entry];
    if (!await saveTimeline(entries, updated)) return;

    closeTimelineForm();
    const action = previous ? "更新" : "登録";
    const outsideTimeline = !matchesGenre(entry.genre);
    timelineStatus(`「${title}」を${categoryName(entry.genre)}のタイムラインに${action}しました。`,
      outsideTimeline ? entry.genre : "", entry.date);
    renderTimeline();
    const list = el("timelineList");
    const savedButton = Array.from(list.querySelectorAll("[data-timeline-edit]"))
      .find(button => button.dataset.timelineEdit === entry.id);
    if (savedButton) {
      savedButton.closest(".timeline-entry").scrollIntoView({block:"nearest"});
      savedButton.focus({preventScroll:true});
    } else {
      el("timelineOpen").focus({preventScroll:true});
    }
  };

  // プレビューでフォーム送信が制限される環境でも、クリックから直接保存する。
  el("timelineSave").addEventListener("click", saveTimelineEntry);
  el("timelineTitle").addEventListener("keydown", event => {
    if (event.key !== "Enter" || event.isComposing || event.keyCode === 229) return;
    event.preventDefault();
    return saveTimelineEntry();
  });
  el("deleteCancel").addEventListener("click", () => el("deleteDialog").close("cancel"));
  el("deleteConfirm").addEventListener("click", () => el("deleteDialog").close("delete"));

  el("timelineList").addEventListener("click", async event => {
    const button = event.target.closest("[data-timeline-edit], [data-timeline-delete]");
    if (!button) return;
    const id = button.dataset.timelineEdit ?? button.dataset.timelineDelete;
    if (button.dataset.timelineDelete &&
        !await confirmDelete("この予定・記録を削除しますか？")) return;

    const entries = readTimeline();
    const entry = entries?.find(item => item.id === id);
    if (!entry) {
      renderTimeline();
      return;
    }
    if (button.dataset.timelineEdit) {
      openTimelineForm(entry);
      return;
    }
    if (!await saveTimeline(entries, entries.filter(item => item.id !== id))) return;
    if (editingTimelineId === id) closeTimelineForm();
    renderTimeline();
    timelineStatus("予定・記録を削除しました。");
    el("timelineForm").hidden ? el("timelineOpen").focus() : el("timelineTitle").focus();
  });

  window.addEventListener("storage", event => {
    if (syncConfigured) return;
    if (event.key === CATEGORY_STORAGE_KEY || event.key === null) {
      const current = readCategories();
      if (current) applyCategories(current);
    }
    if (event.key === TIMELINE_STORAGE_KEY || event.key === null) {
      renderTimeline();
    }
    if (event.key === STORAGE_KEY || event.key === "simple_tasks_v1" || event.key === null) {
      const current = readTasks();
      if (current) {
        tasks = current;
        render();
      } else {
        taskStatus("保存済みのタスクを読み込めませんでした。");
      }
    }
  });
  setInterval(() => {
    if (timelineRenderedOn !== today()) renderTimeline();
  }, 60000);

  const MEMO_DB_NAME = "task_dashboard_memos";
  const MEMO_STORE_NAME = "memos";
  const memoImageType = /^image\/(png|jpeg|webp|gif|bmp|avif)$/i;
  const temporaryMemos = new Map();
  let memoDatabasePromise;
  let savedMemos = [];
  let memoEditId = null;
  let draftImages = [];
  let memoBusy = false;
  const draftImageUrls = [];
  const savedImageUrls = [];
  const memoDateFormat = new Intl.DateTimeFormat("ja-JP", {
    dateStyle:"medium",
    timeStyle:"short"
  });

  const openMemoDatabase = () => new Promise((resolve, reject) => {
    const onOpenError = error => {
      if (error?.name === "SecurityError" || error?.name === "NotAllowedError") {
        resolve(null);
      } else {
        reject(error);
      }
    };

    let request;
    try {
      if (!window.indexedDB) {
        resolve(null);
        return;
      }
      request = window.indexedDB.open(MEMO_DB_NAME, 1);
    } catch (error) {
      onOpenError(error);
      return;
    }

    request.onupgradeneeded = () => {
      request.result.createObjectStore(MEMO_STORE_NAME, {keyPath:"id"});
    };
    request.onsuccess = () => {
      const db = request.result;
      db.onversionchange = () => {
        db.close();
        memoDatabasePromise = undefined;
      };
      resolve(db);
    };
    request.onerror = () => onOpenError(request.error);
  });

  const localMemoAccess = async (action, value) => {
    memoDatabasePromise ??= openMemoDatabase().catch(error => {
      memoDatabasePromise = undefined;
      throw error;
    });
    const db = await memoDatabasePromise;
    if (!syncConfigured) el("memoStorageNotice").hidden = Boolean(db);
    if (!db) {
      if (action === "getAll") return Array.from(temporaryMemos.values());
      if (action === "put") temporaryMemos.set(value.id, value);
      if (action === "delete") temporaryMemos.delete(value);
      return;
    }

    return new Promise((resolve, reject) => {
      const mode = action === "getAll" ? "readonly" : "readwrite";
      const tx = db.transaction(MEMO_STORE_NAME, mode);
      const store = tx.objectStore(MEMO_STORE_NAME);
      const request = action === "getAll" ? store.getAll() : store[action](value);
      tx.oncomplete = () => resolve(request.result);
      tx.onabort = () => reject(tx.error ?? new Error("Memo transaction aborted"));
    });
  };

  const memoAccess = async (action, value) => {
    return syncConfigured ? cloudMemoAccess(action, value) : localMemoAccess(action, value);
  };

  const memoStatus = message => {
    el("memoStatus").textContent = message;
  };

  const releaseMemoImageUrls = urls => {
    urls.forEach(url => URL.revokeObjectURL(url));
    urls.length = 0;
  };

  const memoImageMarkup = (blob, index, urls) => {
    if (!blob) return '<p class="memo-hint">画像を読み込めませんでした</p>';
    const url = URL.createObjectURL(blob);
    urls.push(url);
    return `<button class="memo-image-open" type="button" data-memo-image
        aria-label="画像${index + 1}を拡大">
      <img src="${escapeHtml(url)}" alt="画像${index + 1}" loading="lazy" decoding="async">
    </button>`;
  };

  const renderMemoDraft = () => {
    releaseMemoImageUrls(draftImageUrls);
    el("memoDraftImages").innerHTML = draftImages.map(({blob, caption}, index) => `
      <figure class="memo-attachment">
        ${memoImageMarkup(blob, index, draftImageUrls)}
        <label for="memoCaption-${index}">画像${index + 1}のメモ</label>
        <textarea id="memoCaption-${index}" rows="2" data-memo-caption="${index}">\n${escapeHtml(caption)}</textarea>
        <button class="btn" type="button" data-memo-remove="${index}">画像を外す</button>
      </figure>`).join("");
  };

  const renderMemoList = () => {
    releaseMemoImageUrls(savedImageUrls);
    el("memoList").innerHTML = savedMemos.length ? savedMemos.slice()
      .sort((a, b) => b.updatedAt - a.updatedAt)
      .map(memo => {
        const id = escapeHtml(memo.id);
        return `<article class="memo-note">
          <div class="memo-note-header">
            <time datetime="${new Date(memo.updatedAt).toISOString()}">${memoDateFormat.format(memo.updatedAt)}</time>
            <div class="memo-actions">
              <button class="btn" type="button" data-memo-edit="${id}">編集</button>
              <button class="btn" type="button" data-memo-delete="${id}">削除</button>
            </div>
          </div>
          ${memo.body ? `<p class="memo-text">${escapeHtml(memo.body)}</p>` : ""}
          ${memo.images.length ? `<div class="memo-images">${memo.images.map(({blob, caption}, index) => `
            <figure class="memo-attachment">
              ${memoImageMarkup(blob, index, savedImageUrls)}
              ${caption ? `<figcaption class="memo-caption">${escapeHtml(caption)}</figcaption>` : ""}
            </figure>`).join("")}</div>` : ""}
        </article>`;
      }).join("") : '<p class="memo-empty">保存したメモはありません。</p>';
  };

  const refreshMemos = async () => {
    if (memoBusy) return;
    try {
      savedMemos = await memoAccess("getAll");
      renderMemoList();
    } catch {
      memoStatus("メモを読み込めませんでした。");
    }
  };

  const setMemoDraft = (memo = null) => {
    memoEditId = memo?.id ?? null;
    el("memoBody").value = memo?.body ?? "";
    draftImages = memo ? memo.images.map(image => ({...image})) : [];
    el("memoEditorTitle").textContent = memo ? "メモを編集中" : "新しいメモ";
    el("memoSave").textContent = memo ? "変更を保存" : "メモを保存";
    el("memoCancel").textContent = memo ? "編集をキャンセル" : "入力をクリア";
    renderMemoDraft();
  };

  const setMemoBusy = busy => {
    memoBusy = busy;
    el("memoEditor").disabled = busy;
  };

  const attachMemoImages = files => {
    if (memoBusy || !files.length) return;
    const supported = files.filter(file => memoImageType.test(file.type));
    draftImages.push(...supported.map(blob => ({blob, caption:""})));
    if (supported.length) renderMemoDraft();
    memoStatus(supported.length === files.length
      ? `画像を${supported.length}枚追加しました。`
      : "PNG、JPEG、WebP、GIF、BMP、AVIFの画像を追加できます。");
  };

  el("memoPage").addEventListener("paste", event => {
    const clipboard = event.clipboardData;
    if (!clipboard || memoBusy) return;
    const images = Array.from(clipboard.items ?? [])
      .filter(item => item.kind === "file" && item.type.startsWith("image/"))
      .map(item => item.getAsFile())
      .filter(Boolean);
    const files = images.length ? images : Array.from(clipboard.files ?? [])
      .filter(file => file.type.startsWith("image/"));
    if (!files.length) return;
    event.preventDefault();
    attachMemoImages(files);
  });

  el("memoPickFiles").addEventListener("click", () => el("memoFiles").click());
  el("memoFiles").addEventListener("change", event => {
    attachMemoImages(Array.from(event.target.files));
    event.target.value = "";
  });

  el("memoDraftImages").addEventListener("input", event => {
    const index = event.target.dataset.memoCaption;
    if (index !== undefined) draftImages[index].caption = event.target.value;
  });
  el("memoDraftImages").addEventListener("click", event => {
    const button = event.target.closest("[data-memo-remove]");
    if (!button || memoBusy) return;
    draftImages.splice(Number(button.dataset.memoRemove), 1);
    renderMemoDraft();
    memoStatus("画像を外しました。");
    el("memoPickFiles").focus({preventScroll:true});
  });

  el("memoPage").addEventListener("click", event => {
    const button = event.target.closest("[data-memo-image]");
    if (!button) return;
    const image = button.querySelector("img");
    const viewerImage = el("memoViewerImage");
    viewerImage.src = image.src;
    viewerImage.alt = image.alt;
    el("memoViewer").showModal();
  });
  el("memoCloseViewer").addEventListener("click", () => el("memoViewer").close());
  el("memoViewer").addEventListener("close", () => el("memoViewerImage").removeAttribute("src"));

  el("memoCancel").addEventListener("click", () => {
    setMemoDraft();
    memoStatus("");
    el("memoBody").focus({preventScroll:true});
  });

  el("memoSave").addEventListener("click", async () => {
    if (memoBusy) return;
    const body = el("memoBody").value;
    if (!body.trim() && !draftImages.length) {
      memoStatus("本文を入力するか、画像を追加してください。");
      el("memoBody").focus({preventScroll:true});
      return;
    }

    const memo = {
      id: memoEditId ?? (Date.now() + "-" + Math.random().toString(36).slice(2)),
      body,
      images:draftImages.map(image => ({...image})),
      updatedAt:Date.now()
    };
    setMemoBusy(true);
    try {
      await memoAccess("put", memo);
      savedMemos = [memo, ...savedMemos.filter(item => item.id !== memo.id)];
      renderMemoList();
      setMemoDraft();
      memoStatus("メモを保存しました。");
    } catch (error) {
      memoStatus(saveErrorMessage(error, "メモ"));
    } finally {
      setMemoBusy(false);
    }
  });

  el("memoList").addEventListener("click", async event => {
    const button = event.target.closest("[data-memo-edit], [data-memo-delete]");
    if (!button || memoBusy) return;
    const id = button.dataset.memoEdit ?? button.dataset.memoDelete;
    const memo = savedMemos.find(item => item.id === id);
    if (!memo) return;

    if (button.dataset.memoEdit) {
      if (memoEditId !== id && (el("memoBody").value || draftImages.length)) {
        memoStatus("入力中のメモを保存するか、クリアしてください。");
      } else if (memoEditId !== id) {
        setMemoDraft(memo);
        memoStatus("");
      }
      el("memoEditor").scrollIntoView({block:"start"});
      el("memoBody").focus({preventScroll:true});
      return;
    }

    if (!await confirmDelete("このメモと添付画像を削除しますか？")) return;
    setMemoBusy(true);
    try {
      await memoAccess("delete", id);
      savedMemos = savedMemos.filter(item => item.id !== id);
      renderMemoList();
      if (memoEditId === id) setMemoDraft();
      memoStatus("メモを削除しました。");
    } catch (error) {
      memoStatus(saveErrorMessage(error, "メモの削除操作"));
    } finally {
      setMemoBusy(false);
    }
  });

  const cloudKinds = new Map([
    [STORAGE_KEY, "task"],
    [TIMELINE_STORAGE_KEY, "timeline"],
    [CATEGORY_STORAGE_KEY, "category"]
  ]);
  const cloudRows = new Map(Array.from([...cloudKinds.values(), "memo"], kind => [kind, new Map()]));
  const localStorageSource = storage;
  let cloudClient;
  let cloudUserId = "";
  let cloudReady = false;
  let cloudBusy = false;
  let cloudLockedOnConflict = false;
  const rowFields = "item_id,payload,revision";

  class SyncConflict extends Error {}
  const saveErrorMessage = (error, label) => {
    if (!syncConfigured) {
      return label + "を保存できませんでした。ブラウザの保存設定や空き容量を確認してください。";
    }
    if (error instanceof SyncConflict) {
      return "別の端末で変更されています。編集内容を控え、編集をキャンセルしてから「同期」してください。";
    }
    return label + "の操作を完了できませんでした。通信状況とクラウド同期欄を確認してください。";
  };
  const syncStatus = message => { el("syncStatus").textContent = message; };

  const visibleCloudItems = kind => Array.from(cloudRows.get(kind).values())
    .filter(row => !row.payload.deleted)
    .map(row => row.payload);

  const cloudStorage = {
    getItem(key) {
      const kind = cloudKinds.get(key);
      if (!kind) return null;
      const items = visibleCloudItems(kind);
      if (kind !== "category") return JSON.stringify(items);
      const stored = new Map(items.map(item => [item.id, item]));
      const builtIns = defaultCategories.map(item => stored.get(item.id) ?? item);
      const custom = items.filter(item => item.id.startsWith("category-"))
        .sort((a, b) => a.id.localeCompare(b.id));
      return JSON.stringify([...builtIns, ...custom]);
    }
  };

  const checkedResult = ({data, error}) => {
    if (error) throw error;
    return data;
  };

  const assertCloudUser = userId => {
    if (!userId || userId !== cloudUserId) throw new Error("Cloud session changed");
  };

  const syncVisibility = () => {
    el("syncLoginFields").hidden = Boolean(cloudUserId);
    el("syncAccount").hidden = !cloudUserId;
    el("dashboardView").hidden = !cloudReady || activeView === "memos";
    el("memoPage").hidden = !cloudReady || activeView !== "memos";
    for (const id of ["nav", "dashboardHome", "categorySettings"]) el(id).hidden = !cloudReady;
    el("syncImport").disabled = !cloudReady || temporaryStorage;
  };

  const runCloud = async action => {
    if (cloudBusy) throw new Error("Cloud request in progress");
    cloudBusy = true;
    for (const id of ["syncPanel", "dashboardView", "memoPage", "nav", "categoryManager"]) {
      el(id).inert = true;
    }
    el("dashboardHome").disabled = true;
    el("categorySettings").disabled = true;
    try {
      return await action();
    } finally {
      cloudBusy = false;
      for (const id of ["syncPanel", "dashboardView", "memoPage", "nav", "categoryManager"]) {
        el(id).inert = false;
      }
      el("dashboardHome").disabled = false;
      el("categorySettings").disabled = false;
    }
  };

  const writeCloudRow = async (kind, id, payload, userId, importOnly = false) => {
    assertCloudUser(userId);
    const rows = cloudRows.get(kind);
    const previous = rows.get(id);
    if (importOnly && previous) return false;
    if (previous?.payload.deleted) throw new SyncConflict();

    const table = cloudClient.from("dashboard_items");
    let result;
    if (previous) {
      result = await table.update({payload, revision:Number(previous.revision) + 1})
        .eq("user_id", userId).eq("kind", kind).eq("item_id", id)
        .eq("revision", previous.revision).select(rowFields);
    } else {
      const record = {user_id:userId, kind, item_id:id, payload};
      result = importOnly
        ? await table.upsert(record, {onConflict:"user_id,kind,item_id", ignoreDuplicates:true}).select(rowFields)
        : await table.insert(record).select(rowFields);
    }

    assertCloudUser(userId);
    if (result.error?.code === "23505" || (!result.error && !result.data.length && !importOnly)) {
      throw new SyncConflict();
    }
    const [saved] = checkedResult(result);
    if (!saved) return false;
    rows.set(id, saved);
    return true;
  };

  const handleCloudWriteError = error => {
    cloudLockedOnConflict = true;
    syncStatus(error instanceof SyncConflict
      ? "別の端末で更新されています。「同期」で最新の内容を読み込んでください。"
      : "クラウド保存の結果を確認できませんでした。「同期」で保存先の状態を確認してください。");
    throw error;
  };

  const saveCollection = (kind, key, current, updated) => {
    if (!syncConfigured) {
      storage.setItem(key, JSON.stringify(updated));
      return;
    }
    return runCloud(async () => {
      if (!cloudReady || cloudLockedOnConflict) throw new SyncConflict();
      const userId = cloudUserId;
      const before = new Map(current.map(item => [String(item.id), item]));
      try {
        for (const item of updated) {
          const id = String(item.id);
          const previous = before.get(id);
          before.delete(id);
          if (JSON.stringify(item) !== JSON.stringify(previous)) {
            await writeCloudRow(kind, id, item, userId);
          }
        }
        for (const id of before.keys()) {
          await writeCloudRow(kind, id, {deleted:true}, userId);
        }
        syncStatus("クラウドに保存しました。");
      } catch (error) {
        handleCloudWriteError(error);
      }
    });
  };

  const encodeCloudMemo = async (memo, userId) => {
    const images = [];
    for (const {blob, caption, path} of memo.images) {
      assertCloudUser(userId);
      if (path) {
        images.push({caption, path});
        continue;
      }
      const hash = await crypto.subtle.digest("SHA-256", await blob.arrayBuffer());
      const hex = Array.from(new Uint8Array(hash), byte => byte.toString(16).padStart(2, "0")).join("");
      const objectPath = userId + "/" + encodeURIComponent(memo.id) + "/" + hex;
      assertCloudUser(userId);
      const result = await cloudClient.storage.from("dashboard-images")
        .upload(objectPath, blob, {contentType:blob.type, upsert:false});
      // 同じ画像を再送した場合、以前のアップロードをそのまま使う。
      const alreadyUploaded = result.error?.statusCode === "409" ||
        result.error?.statusCode === 409 || result.error?.error === "Duplicate" ||
        result.error?.code === "ResourceAlreadyExists" || result.error?.code === "KeyAlreadyExists";
      if (!alreadyUploaded) checkedResult(result);
      images.push({caption, path:objectPath});
    }
    return {...memo, images};
  };

  const decodeCloudMemos = async userId => {
    const memos = visibleCloudItems("memo");
    const output = [];
    for (const memo of memos) {
      const images = [];
      for (const {caption, path} of memo.images) {
        assertCloudUser(userId);
        try {
          const blob = checkedResult(await cloudClient.storage.from("dashboard-images").download(path));
          images.push({blob, caption, path});
        } catch {
          images.push({blob:null, caption, path});
        }
      }
      output.push({...memo, images});
    }
    assertCloudUser(userId);
    return output;
  };

  const cloudMemoAccess = (action, value) => {
    const userId = cloudUserId;
    if (action === "getAll") return decodeCloudMemos(userId);
    return runCloud(async () => {
      if (!cloudReady || cloudLockedOnConflict) throw new SyncConflict();
      try {
        if (action === "delete") {
          await writeCloudRow("memo", value, {deleted:true}, userId);
        } else {
          const memo = await encodeCloudMemo(value, userId);
          await writeCloudRow("memo", value.id, memo, userId);
        }
        syncStatus("クラウドに保存しました。");
      } catch (error) {
        handleCloudWriteError(error);
      }
    });
  };

  const loadCloudRows = async userId => {
    const loaded = new Map();
    for (const kind of cloudRows.keys()) {
      const rows = new Map();
      let lastId = null;
      while (true) {
        let query = cloudClient.from("dashboard_items").select(rowFields)
          .eq("user_id", userId).eq("kind", kind).order("item_id").limit(100);
        if (lastId !== null) query = query.gt("item_id", lastId);
        const page = checkedResult(await query);
        for (const row of page) rows.set(row.item_id, row);
        if (!page.length) break;
        lastId = page[page.length - 1].item_id;
      }
      loaded.set(kind, rows);
    }
    assertCloudUser(userId);
    for (const [kind, rows] of loaded) cloudRows.set(kind, rows);
  };

  const refreshCloud = async () => {
    await loadCloudRows(cloudUserId);
    cloudReady = true;
    cloudLockedOnConflict = false;
    tasks = readTasks() ?? [];
    applyCategories(readCategories() ?? defaultCategories);
    syncVisibility();
    if (activeView === "memos") await refreshMemos();
    syncStatus("同期しました。");
  };

  const resetCloudSession = (userId = "") => {
    cloudUserId = userId;
    cloudReady = false;
    cloudLockedOnConflict = false;
    for (const rows of cloudRows.values()) rows.clear();
    tasks = [];
    categories = defaultCategories;
    selectedGenre = activeView = "all";
    for (const id of ["categoryManager", "deleteDialog", "memoViewer"]) {
      if (el(id).open) el(id).close();
    }
    el("categoryRows").replaceChildren();
    resetForm();
    closeTimelineForm();
    timelineStatus("");
    setMemoDraft();
    savedMemos = [];
    renderMemoList();
    memoStatus("");
    renderCategoryControls();
    renderTimeline();
    render();
    syncVisibility();
  };

  const syncFailed = error => {
    const detail = error?.code || error?.status || "";
    syncStatus("同期できませんでした。Supabaseの接続情報とテーブルの設定を確認してください。" +
      (detail ? " コード: " + detail : ""));
  };

  const hasOpenEditor = () => editingId !== null || !el("timelineForm").hidden ||
    memoEditId !== null || el("categoryManager").open;

  const initializeCloud = async () => {
    storage = cloudStorage;
    el("syncPanel").hidden = false;
    resetCloudSession();
    if (!/^https:\/\/[a-z0-9]+\.supabase\.co\/?$/.test(SUPABASE_PROJECT_URL) ||
        !SUPABASE_PUBLISHABLE_KEY.startsWith("sb_publishable_")) {
      el("syncLoginFields").hidden = true;
      syncStatus("HTMLのProject URLとPublishable keyの2行を確認してください。");
      return;
    }
    if (!window.supabase) {
      el("syncLoginFields").hidden = true;
      syncStatus("接続ライブラリを読み込んでいます…");
      await new Promise(resolve => {
        const script = document.createElement("script");
        script.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
        script.onload = script.onerror = resolve;
        document.head.append(script);
      });
      if (!window.supabase) {
        syncStatus("接続ライブラリを読み込めませんでした。ネットに接続してページを再読み込みしてください。");
        return;
      }
      el("syncLoginFields").hidden = false;
    }
    syncStatus("クラウドのタスクやメモを使うにはログインしてください。");
    cloudClient = window.supabase.createClient(SUPABASE_PROJECT_URL, SUPABASE_PUBLISHABLE_KEY, {
      auth:{detectSessionInUrl:false}
    });
    cloudClient.auth.onAuthStateChange((event, session) => {
      const next = session?.user?.id;
      if (cloudUserId && (event === "SIGNED_OUT" || (next && next !== cloudUserId))) {
        resetCloudSession();
        syncStatus("ログインしてください。");
      }
    });
    el("syncLogin").addEventListener("click", async () => {
      const email = el("syncEmail").value.trim();
      const password = el("syncPassword").value;
      if (!email || !password) {
        syncStatus("メールアドレスとパスワードを入力してください。");
        return;
      }
      try {
        await runCloud(async () => {
          syncStatus("ログインしています…");
          const data = checkedResult(await cloudClient.auth.signInWithPassword({email, password}));
          resetCloudSession(data.user.id);
          el("syncPassword").value = "";
          await refreshCloud();
        });
      } catch (error) {
        if (cloudUserId) syncFailed(error);
        else syncStatus("ログインできませんでした。メールアドレス・パスワード・接続先を確認してください。");
      }
    });
    el("syncRefresh").addEventListener("click", async () => {
      if (hasOpenEditor()) {
        syncStatus("編集中の項目を保存するかキャンセルしてから同期してください。");
        return;
      }
      try {
        await runCloud(refreshCloud);
      } catch (error) {
        syncFailed(error);
      }
    });
    el("syncLogout").addEventListener("click", async () => {
      try {
        await runCloud(async () => {
          checkedResult(await cloudClient.auth.signOut({scope:"local"}));
          resetCloudSession();
          syncStatus("ログアウトしました。");
        });
      } catch {
        syncStatus("ログアウトできませんでした。");
      }
    });
    el("syncImport").addEventListener("click", async () => {
      if (hasOpenEditor()) {
        syncStatus("編集中の項目を保存するかキャンセルしてから取り込んでください。");
        return;
      }
      try {
        await runCloud(importLocalData);
      } catch (error) {
        syncFailed(error);
      }
    });

    try {
      await runCloud(async () => {
        const {session} = checkedResult(await cloudClient.auth.getSession());
        if (!session) return;
        resetCloudSession(session.user.id);
        await refreshCloud();
      });
    } catch (error) {
      syncFailed(error);
    }
  };

  const importLocalData = async () => {
    const userId = cloudUserId;
    if (!cloudReady || temporaryStorage) return;
    syncStatus("この端末のデータを確認しています…");
    const categoryItems = readCategories(localStorageSource);
    const localTasks = readTasks(localStorageSource);
    const timelineItems = readTimeline(localStorageSource);
    const memos = await localMemoAccess("getAll");
    el("memoStorageNotice").hidden = true;
    if (!categoryItems || !localTasks || !timelineItems) {
      syncStatus("ブラウザに保存されたデータを読み込めませんでした。取り込みは行っていません。");
      return;
    }

    const groups = [
      ["category", categoryItems.filter(item =>
        !defaultCategories.some(original => item.id === original.id && item.name === original.name))],
      ["task", localTasks],
      ["timeline", timelineItems],
      ["memo", memos]
    ];
    let imported = 0;
    let skipped = 0;
    let failed = 0;
    for (const [kind, items] of groups) {
      for (const item of items) {
        assertCloudUser(userId);
        if (item.id === undefined || item.id === null) {
          failed++;
          continue;
        }
        const id = String(item.id);
        if (cloudRows.get(kind).has(id)) {
          skipped++;
          continue;
        }
        try {
          const payload = kind === "memo" ? await encodeCloudMemo(item, userId) : item;
          if (await writeCloudRow(kind, id, payload, userId, true)) imported++;
          else skipped++;
        } catch {
          failed++;
        }
      }
    }
    const summary = `取り込み ${imported}件 / 登録済み・削除済み ${skipped}件 / 失敗 ${failed}件。`;
    try {
      await refreshCloud();
      syncStatus(summary + (failed ? " 失敗した項目はこの端末から再試行できます。" : ""));
    } catch {
      syncStatus(summary + " 一覧の更新に失敗しました。「同期」を押してください。");
    }
  };

  if (syncConfigured) initializeCloud();
  else {
    renderCategoryControls();
    showView("all");
  }
  if (!loadedTasks) taskStatus("保存済みのタスクを読み込めませんでした。");
  if (temporaryStorage) {
    el("storageNotice").textContent =
      "この画面では入力内容を一時的に保持します。保存して使うには、HTMLをダウンロードしてChromeで開くか、公開済みのGitHub Pagesから開いてください。";
  } else {
    el("storageNotice").hidden = true;
  }
})();
</script>
</body>
</html>
